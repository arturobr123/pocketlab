name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Smoke run
        run: cargo run --quiet
      - name: Live Limitless meta smoke
        run: |
          cargo run --quiet -- meta 'PMPT #44'
      - name: Live end-to-end evaluation smoke
        run: |
          cat > /tmp/pmpt44-winner.txt <<'EOF'
          Energy: Grass
          2 Combee B4 10
          2 Vespiquen ex B4 11
          2 Shuckle ex A4 21
          1 Teal Mask Ogerpon ex B2 17
          2 Professor's Research P-A 7
          2 Copycat B1 225
          1 Cyrus A2 150
          1 Sabrina A1 225
          2 X Speed P-A 2
          1 Field Blower B3 147
          2 Leaf Cape A3 147
          2 Fragrant Forest B3 153
          EOF
          cargo run --quiet -- evaluate /tmp/pmpt44-winner.txt 'PMPT #44' 1
      - name: Format
        run: cargo fmt --all -- --check
