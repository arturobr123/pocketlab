name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Smoke run
        run: cargo run --quiet
      - name: Inspect Pocket standings schema
        run: |
          curl -fsSL https://play.limitlesstcg.com/api/tournaments/pmpt44/standings \
            | jq 'map(select(.decklist != null))[0] | {player, placing, deck, decklist}'
      - name: Format
        run: cargo fmt --all -- --check
