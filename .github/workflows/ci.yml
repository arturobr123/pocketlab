name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Smoke run
        run: cargo run --quiet
      - name: Inspect Pocket standings schema
        run: |
          tournament_id="$(curl -fsSL 'https://play.limitlesstcg.com/api/tournaments?game=POCKET&limit=100' \
            | jq -r '.[] | select(.name | contains("PMPT #44")) | .id' \
            | head -n 1)"
          test -n "$tournament_id"
          curl -fsSL "https://play.limitlesstcg.com/api/tournaments/${tournament_id}/standings" \
            | jq 'map(select(.decklist != null))[0] | {player, placing, deck, decklist}'
      - name: Format
        run: cargo fmt --all -- --check
