[package]
name = "pocketlab"
version = "0.1.0"
edition = "2021"
description = "Robust deck search for Pokemon TCG Pocket"
license = "AGPL-3.0-only"

[features]
default = ["deckgym"]
deckgym = ["dep:deckgym", "dep:rayon", "dep:strum"]

[dependencies]
deckgym = { git = "https://github.com/bcollazo/deckgym-core.git", rev = "fda48391a4747c7d9085e6a95520b731cee0b546", optional = true }
rayon = { version = "1.10", optional = true }
strum = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "pocketlab"
path = "src/lib.rs"

[[bin]]
name = "pocketlab"
path = "src/main.rs"
